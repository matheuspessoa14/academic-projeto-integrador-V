services:
  auth-service:
    build:
      context: ./services/auth-service
    image: lumera-auth-service:dev
    ports:
      - "3001:3000"
    env_file:
      - .env.compose
    environment:
      NODE_ENV: development
      PORT: "3000"
    restart: "no"

  appointment-service:
    build:
      context: ./services/appointment-service
    image: lumera-appointment-service:dev
    ports:
      - "3002:3000"
    env_file:
      - ./services/appointment-service/.env
    environment:
      NODE_ENV: development
      PORT: "3000"
    restart: "no"

  gateway:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - appointment-service
    restart: "no"
