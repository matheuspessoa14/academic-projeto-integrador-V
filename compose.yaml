services:
  auth-service:
    build:
      context: ./services/auth-service
    image: lumera-auth-service:dev
    ports:
      - "3001:3000"
    env_file:
      - .env.compose
    environment:
      NODE_ENV: development
      PORT: "3000"
    restart: "no"

  gateway:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
    restart: "no"

  postgres-prontuario:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: lumera_prontuario
      POSTGRES_PASSWORD: ${PRONTUARIO_DB_PASSWORD:?Senha nao definida}
      POSTGRES_DB: lumera_prontuario_dev

    ports:
      - "127.0.0.1:55432:5432"

    volumes:
      - postgres_prontuario_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_prontuario_data:
